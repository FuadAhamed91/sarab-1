<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SARAB-1 texture sheet</title>
<!-- Draws one texture for the Blender model, chosen by the URL hash (textures.html#esp32_pcb).
     render_textures.py saves each one as a PNG with headless Chrome, at the size listed in TEX. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@600;700&family=Saira+Semi+Condensed:wght@500;600;700&display=block">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* All boards are drawn in millimetres in board-local coordinates: origin at the board's
   lower-left corner seen from above, +x right, +y up, matching the UVs the Blender script gives each top face. */
const SILK = '#F2F4F1', GOLD = '#D9B45A', MONO = '"IBM Plex Mono", monospace', SANS = '"IBM Plex Sans", sans-serif';

function rng(seed) { let s = seed >>> 0; return () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296; }

/* sets up a canvas of w x h mm at ppm pixels per mm, y up */
let PPM = 1, HMM = 1;
function board(g, wmm, hmm, ppm, base) {
  PPM = ppm; HMM = hmm;
  g.fillStyle = base; g.fillRect(0, 0, wmm * ppm, hmm * ppm);
  g.setTransform(ppm, 0, 0, -ppm, 0, hmm * ppm);
  return { w: wmm, h: hmm };
}
function traces(g, b, color, seed, n = 30) {
  const r = rng(seed); g.save(); g.strokeStyle = color; g.lineWidth = 0.32; g.lineCap = 'round'; g.lineJoin = 'round';
  for (let i = 0; i < n; i++) {
    let x = r() * b.w, y = r() * b.h; g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 3; k++) { const d = (r() - 0.5) * b.w * 0.5; if (r() > 0.5) x += d; else y += d * 0.6; g.lineTo(Math.max(0.6, Math.min(b.w - 0.6, x)), Math.max(0.6, Math.min(b.h - 0.6, y))); }
    g.stroke();
  }
  g.restore();
}
function text(g, s, x, y, size, opts = {}) {      // text at (x, y) mm, size in mm, drawn in pixel space so small type stays sharp
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.translate(x * PPM, (HMM - y) * PPM); if (opts.rot) g.rotate(opts.rot);
  g.font = `${opts.weight || 500} ${size * PPM}px ${opts.font || MONO}`; g.fillStyle = opts.color || SILK;
  g.textAlign = opts.align || 'center'; g.textBaseline = 'middle'; g.fillText(s, 0, 0); g.restore();
}
function pad(g, x, y, r = 0.85, square = false) {
  g.fillStyle = GOLD; g.beginPath();
  if (square) g.rect(x - r, y - r, 2 * r, 2 * r); else g.arc(x, y, r, 0, 7);
  g.fill(); g.fillStyle = '#2a2a24'; g.beginPath(); g.arc(x, y, r * 0.48, 0, 7); g.fill();
}
function hole(g, x, y, r = 1.5) { g.fillStyle = GOLD; g.beginPath(); g.arc(x, y, r + 0.7, 0, 7); g.fill(); g.fillStyle = '#0b0c0d'; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }
function outline(g, x, y, w, h, lw = 0.18) { g.strokeStyle = SILK; g.lineWidth = lw; g.strokeRect(x, y, w, h); }
function smd(g, x, y, w, h, body = '#1b1b1b') { g.fillStyle = '#c9c9c3'; g.fillRect(x - w / 2 - 0.25, y - h / 2, 0.5, h); g.fillRect(x + w / 2 - 0.25, y - h / 2, 0.5, h); g.fillStyle = body; g.fillRect(x - w / 2 + 0.25, y - h / 2, w - 0.5, h); }
function row(g, n, x0, y0, dx, dy, labels, side, size = 0.95) {
  for (let i = 0; i < n; i++) {
    const x = x0 + i * dx, y = y0 + i * dy; pad(g, x, y, 0.85, i === 0);
    if (labels && labels[i]) text(g, labels[i], x + (side === 'x' ? 0 : side), y + (side === 'x' ? -1.9 : 0), size, side === 'x' ? {} : { align: side > 0 ? 'left' : 'right' });
  }
}

const TEX = {
  /* ESP32 DevKit V1 (30 pin), 51.5 x 28.3 mm, USB at -x, module at +x. Pin rows 1.45 mm in from each long edge. */
  esp32_pcb: [1030, 566, g => {
    const b = board(g, 51.5, 28.3, 20, '#141619'); traces(g, b, 'rgba(255,255,255,.07)', 11, 34);
    const x0 = 25.75 - 17.78, hi = ['VIN', 'GND', 'D13', 'D12', 'D14', 'D27', 'D26', 'D25', 'D33', 'D32', 'D35', 'D34', 'VN', 'VP', 'EN'];
    const lo = ['3V3', 'GND', 'D15', 'D2', 'D4', 'RX2', 'TX2', 'D5', 'D18', 'D19', 'D21', 'RX0', 'TX0', 'D22', 'D23'];
    for (let i = 0; i < 15; i++) { const x = x0 + i * 2.54; pad(g, x, 26.7, 0.9, i === 0); pad(g, x, 1.6, 0.9, i === 0); text(g, hi[i], x, 24.4, 0.95); text(g, lo[i], x, 3.9, 0.95); }
    outline(g, 1.2, 9.6, 6.6, 9.0);               // USB
    for (const y of [6.5, 21.8]) { g.fillStyle = '#d7d7d2'; g.fillRect(8.6, y - 1.6, 4.2, 3.2); g.fillStyle = '#1d1d1d'; g.beginPath(); g.arc(10.7, y, 1.05, 0, 7); g.fill(); }
    text(g, 'EN', 10.7, 9.4, 1.0); text(g, 'BOOT', 10.7, 18.9, 1.0);
    smd(g, 16.6, 10.2, 3.4, 3.0); smd(g, 16.6, 18.0, 3.6, 3.6);   // regulator, USB bridge
    text(g, 'ESP32', 21.3, 14.2, 2.1, { weight: 600, rot: Math.PI / 2 });
    text(g, 'DEVKIT V1', 19.3, 14.2, 1.1, { rot: Math.PI / 2 });
    g.fillStyle = '#e8473b'; g.fillRect(13.4, 12.6, 0.9, 0.55); g.fillStyle = '#4aa3ff'; g.fillRect(13.4, 15.2, 0.9, 0.55);
    hole(g, 2.4, 2.4, 1.1); hole(g, 2.4, 25.9, 1.1); hole(g, 49.1, 2.4, 1.1); hole(g, 49.1, 25.9, 1.1);
  }],

  /* ESP32-WROOM-32 module: 25.5 x 18 mm; metal can over the left 18 mm, PCB antenna on the right */
  wroom: [1020, 720, g => {
    const b = board(g, 25.5, 18, 40, '#121417');
    g.strokeStyle = GOLD; g.lineWidth = 0.5; g.beginPath(); let x = 19.3, y = 2.2; g.moveTo(x, y);
    for (let k = 0; k < 6; k++) { y += 1.0; g.lineTo(x, y); x = k % 2 ? 19.3 : 24.4; g.lineTo(x, y); y += 1.0; g.lineTo(x, y); x = k % 2 ? 24.4 : 19.3; } g.stroke();
    text(g, 'ANT', 21.9, 16.4, 0.9, { color: 'rgba(242,244,241,.7)' });
  }],
  wroom_can: [720, 640, g => {
    const b = board(g, 18, 16, 40, '#C9CED2');
    const gr = g.createLinearGradient(0, 0, 18, 16); gr.addColorStop(0, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(0,0,0,.12)'); g.fillStyle = gr; g.fillRect(0, 0, 18, 16);
    const ink = 'rgba(45,50,56,.82)';
    text(g, 'ESP32-WROOM-32', 9, 12.2, 1.55, { color: ink, weight: 600 });
    text(g, 'Espressif', 9, 10.0, 1.2, { color: ink, font: SANS, weight: 600 });
    text(g, 'FCC ID: 2AC7Z-ESPWROOM32', 9, 6.8, 0.85, { color: ink });
    text(g, '211-161007', 9, 5.5, 0.85, { color: ink });
    const r = rng(7); g.fillStyle = ink; for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) if (r() > 0.45) g.fillRect(12.6 + i * 0.42, 1.2 + j * 0.42, 0.42, 0.42);
    g.strokeStyle = ink; g.lineWidth = 0.12; g.strokeRect(12.4, 1.0, 3.8, 3.8);
  }],

  /* GY-NEO6MV2 GPS board, 36 x 25 mm; header column at the -x end */
  gps_pcb: [1080, 750, g => {
    const b = board(g, 36, 25, 30, '#1C4FA0'); traces(g, b, 'rgba(255,255,255,.09)', 23, 28);
    const pins = ['GND', 'TX', 'RX', 'VCC'];
    for (let i = 0; i < 4; i++) { const y = 12.5 - 3.81 + i * 2.54; pad(g, 2.0, y, 0.85, i === 3); text(g, pins[i], 3.5, y, 0.95, { align: 'left' }); }
    text(g, 'GY-NEO6MV2', 18, 2.6, 1.6, { weight: 600 });
    outline(g, 13.6, 6.0, 16.8, 13.0);                                        // module footprint, matches the 3D can
    g.fillStyle = GOLD; g.fillRect(30.6, 11.2, 2.6, 2.6);                     // u.FL antenna socket pad
    g.fillStyle = '#C9CED2'; g.beginPath(); g.arc(32.6, 17.8, 2.2, 0, 7); g.fill(); text(g, '+', 32.6, 17.8, 1.3, { color: '#5b6168', weight: 700 });
    g.fillStyle = '#ffd9a0'; g.fillRect(32.7, 9.3, 1.0, 0.6); text(g, 'PPS', 33.2, 7.8, 0.9);
    hole(g, 2.6, 2.6, 1.2); hole(g, 33.4, 2.6, 1.2); hole(g, 2.6, 22.4, 1.2); hole(g, 33.4, 22.4, 1.2);
  }],
  gps_can: [640, 488, g => {
    const b = board(g, 16, 12.2, 40, '#C9CED2');
    const gr = g.createLinearGradient(0, 0, 16, 12.2); gr.addColorStop(0, 'rgba(255,255,255,.2)'); gr.addColorStop(1, 'rgba(0,0,0,.1)'); g.fillStyle = gr; g.fillRect(0, 0, 16, 12.2);
    const ink = 'rgba(45,50,56,.85)';
    text(g, 'u-blox', 8, 9.2, 2.2, { color: ink, font: SANS, weight: 700 });
    text(g, 'NEO-6M-0-001', 8, 6.2, 1.25, { color: ink, weight: 600 });
    text(g, '1652 7A84 03', 8, 4.4, 0.95, { color: ink });
    const r = rng(19); g.fillStyle = ink; for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) if (r() > 0.45) g.fillRect(12.4 + i * 0.4, 0.8 + j * 0.4, 0.4, 0.4);
  }],

  /* INA219 breakout, 22.3 x 25.5 mm: header along the low-y edge, screw terminal along the high-y edge */
  ina_pcb: [892, 1020, g => {
    const b = board(g, 22.3, 25.5, 40, '#1C4FA0'); traces(g, b, 'rgba(255,255,255,.09)', 31, 22);
    const pins = ['VCC', 'GND', 'SCL', 'SDA', 'VIN-', 'VIN+'];
    for (let i = 0; i < 6; i++) { const x = 11.15 - 6.35 + i * 2.54; pad(g, x, 1.75, 0.85, i === 0); text(g, pins[i], x, 4.1, 0.85); }
    smd(g, 11.15, 13.0, 6.2, 3.0, '#2a2a2a'); text(g, 'R100', 11.15, 13.0, 1.1);
    smd(g, 6.0, 8.8, 3.0, 2.6); text(g, 'INA219', 11.15, 17.4, 1.7, { weight: 600 });
    text(g, 'VIN+', 8.3, 20.0, 0.9); text(g, 'VIN-', 14.0, 20.0, 0.9);
    hole(g, 2.4, 22.9, 1.15); hole(g, 19.9, 22.9, 1.15);
  }],

  /* GY-521 (MPU6050), 21 x 16 mm: 8-pin header along the low-y edge */
  mpu_pcb: [840, 640, g => {
    const b = board(g, 21, 16, 40, '#1C4FA0'); traces(g, b, 'rgba(255,255,255,.09)', 41, 18);
    const pins = ['VCC', 'GND', 'SCL', 'SDA', 'XDA', 'XCL', 'AD0', 'INT'];
    for (let i = 0; i < 8; i++) { const x = 10.5 - 8.89 + i * 2.54; pad(g, x, 1.25, 0.8, i === 0); text(g, pins[i], x, 3.3, 0.8); }
    outline(g, 8.3, 5.8, 4.4, 4.4); text(g, 'GY-521', 10.5, 13.2, 1.5, { weight: 600 });
    g.strokeStyle = SILK; g.lineWidth = 0.18; g.beginPath(); g.moveTo(15, 7); g.lineTo(18.5, 7); g.lineTo(17.6, 7.6); g.moveTo(18.5, 7); g.lineTo(17.6, 6.4); g.moveTo(15, 7); g.lineTo(15, 10.5); g.lineTo(14.4, 9.6); g.moveTo(15, 10.5); g.lineTo(15.6, 9.6); g.stroke();
    text(g, 'X', 19.3, 7, 0.9); text(g, 'Y', 15, 11.4, 0.9);
    hole(g, 2.2, 13.8, 1.3); hole(g, 18.8, 13.8, 1.3);
  }],

  /* TP4056 charger with 5 V boost, 33 x 23 mm; USB-C at the +x end */
  chg_pcb: [990, 690, g => {
    const b = board(g, 33, 23, 30, '#1C4FA0'); traces(g, b, 'rgba(255,255,255,.09)', 53, 24);
    for (const [x, y, l] of [[2.2, 19.2, 'B+'], [2.2, 3.8, 'B-'], [30.6, 19.6, 'OUT+'], [30.6, 3.4, 'OUT-']]) { g.fillStyle = GOLD; g.fillRect(x - 1.5, y - 1.2, 3, 2.4); text(g, l, x + (x < 10 ? 3.6 : -3.9), y, 1.0); }
    smd(g, 10.5, 15.5, 4.0, 3.0); text(g, 'TP4056', 10.5, 11.6, 1.2);
    smd(g, 18.5, 7.0, 3.0, 2.4);
    g.fillStyle = '#2c2c2c'; g.fillRect(15.4, 13.2, 5.2, 5.2); g.fillStyle = '#4a4a4a'; g.beginPath(); g.arc(18, 15.8, 2.0, 0, 7); g.fill();
    g.fillStyle = '#e8473b'; g.fillRect(6.0, 8.0, 1.0, 0.6); g.fillStyle = '#3fbf6a'; g.fillRect(6.0, 6.6, 1.0, 0.6);
    text(g, 'CHRG', 9.6, 8.3, 0.8); text(g, 'STDBY', 9.9, 6.9, 0.8);
    for (const [y, l] of [[20.8, 'IN+'], [2.2, 'IN-']]) { g.fillStyle = GOLD; g.fillRect(21.3, y - 0.9, 2.4, 1.8); text(g, l, 19.6, y, 0.95, { align: 'right' }); }   // solar panel input
  }],

  /* 0.96" SSD1306 module front, 27 x 27.5 mm (x right, z up); header along the top edge */
  oled_pcb: [810, 825, g => {
    const b = board(g, 27, 27.5, 30, '#1C4FA0'); traces(g, b, 'rgba(255,255,255,.08)', 61, 10);
    const pins = ['GND', 'VCC', 'SCL', 'SDA'];
    for (let i = 0; i < 4; i++) { const x = 13.5 - 3.81 + i * 2.54; pad(g, x, 26.0, 0.8, i === 0); text(g, pins[i], x, 23.9, 0.85); }
    hole(g, 1.9, 25.6, 1.0); hole(g, 25.1, 25.6, 1.0); hole(g, 1.9, 1.9, 1.0); hole(g, 25.1, 1.9, 1.0);
    g.fillStyle = '#0c0d10'; g.fillRect(0.5, 4.2, 26, 1.4);
  }],

  /* 6 V solar panel cells, 95 x 65 mm: 12 mono cells, 4 x 3 */
  solar: [1140, 780, g => {
    const b = board(g, 95, 65, 12, '#0B1626');
    const cols = 4, rows = 3, gap = 1.2, m = 1.6, cw = (95 - 2 * m - gap * (cols - 1)) / cols, ch = (65 - 2 * m - gap * (rows - 1)) / rows;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      const x = m + i * (cw + gap), y = m + j * (ch + gap);
      const gr = g.createLinearGradient(x, y, x + cw, y + ch); gr.addColorStop(0, '#22395E'); gr.addColorStop(0.55, '#16294A'); gr.addColorStop(1, '#101F3A');
      g.fillStyle = gr; g.fillRect(x, y, cw, ch);
      g.fillStyle = 'rgba(255,255,255,.035)'; for (const cx of [x, x + cw]) for (const cy of [y, y + ch]) { g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + (cx === x ? 1.6 : -1.6), cy); g.lineTo(cx, cy + (cy === y ? 1.6 : -1.6)); g.fill(); }
      g.strokeStyle = 'rgba(205,212,222,.45)'; g.lineWidth = 0.09;
      for (let k = 1; k < 26; k++) { g.beginPath(); g.moveTo(x, y + ch * k / 26); g.lineTo(x + cw, y + ch * k / 26); g.stroke(); }
      g.fillStyle = 'rgba(215,221,228,.9)'; for (const f of [0.3, 0.7]) g.fillRect(x + cw * f - 0.45, y, 0.9, ch);
    }
  }],

  /* 3.7 V 1000 mAh pouch cell label, 50 x 34 mm */
  battery: [1000, 680, g => {
    const b = board(g, 50, 34, 20, '#A7B2BC');
    const gr = g.createLinearGradient(0, 0, 50, 34); gr.addColorStop(0, 'rgba(255,255,255,.25)'); gr.addColorStop(1, 'rgba(0,0,0,.1)'); g.fillStyle = gr; g.fillRect(0, 0, 50, 34);
    g.fillStyle = '#1E2933'; g.fillRect(3, 7, 44, 20);
    text(g, '3.7V 1000mAh', 25, 21.6, 4.0, { weight: 600 });
    text(g, 'Li-Po  103450', 25, 16.6, 2.6);
    text(g, '+  RED     −  BLACK', 25, 11.7, 1.7, { color: 'rgba(242,244,241,.75)' });
    text(g, 'DO NOT SHORT · PUNCTURE · HEAT ABOVE 60 °C', 25, 3.6, 1.15, { color: '#26323c' });
  }],

  /* +X side panel print, 83 x 103.5 mm (seen from outside: +y right, z up) */
  decal: [830, 1035, g => {
    const b = board(g, 83, 103.5, 10, '#1E2226');
    const r = rng(5); for (let i = 0; i < 2600; i++) { const a = r() * 0.05; g.fillStyle = r() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.4})`; g.fillRect(r() * 83, r() * 103.5, 0.1 + r() * 0.2, 0.1 + r() * 0.2); }
    g.strokeStyle = 'rgba(232,238,242,.26)'; g.lineWidth = 0.35; g.beginPath(); g.moveTo(21, 69); g.lineTo(62, 69); g.moveTo(21, 28); g.lineTo(62, 28); g.stroke();
    text(g, 'SARAB-1', 41.5, 56.2, 12.6, { font: '"Saira Semi Condensed", sans-serif', weight: 700, color: '#EEF2F4' });
    text(g, 'سراب', 41.5, 42.5, 10.5, { font: '"IBM Plex Sans Arabic", sans-serif', weight: 700, color: '#5EB3E8' });
    text(g, 'TEAM CODEBUSTERS · SATFORGE UAE 2026', 41.5, 32.4, 3.1, { font: '"Saira Semi Condensed", sans-serif', weight: 600, color: 'rgba(238,242,244,.7)' });
    text(g, 'GULF GNSS INTERFERENCE WATCH', 41.5, 74.0, 2.5, { font: '"Saira Semi Condensed", sans-serif', weight: 600, color: 'rgba(238,242,244,.5)' });
  }],

  /* the OLED's status page as the firmware draws it (128 x 64 pixels, shown at 4x) */
  oled_ui: [512, 256, g => {
    g.fillStyle = '#020304'; g.fillRect(0, 0, 512, 256);
    g.fillStyle = '#9FE0FF'; g.textBaseline = 'alphabetic';
    g.font = '600 40px "IBM Plex Mono", monospace'; g.fillText('SARAB-1', 14, 44); g.textAlign = 'right'; g.fillText('#4821', 498, 44); g.textAlign = 'left';
    g.font = '500 34px "IBM Plex Mono", monospace';
    ['GPS 3D  9 sats', 'IDX 4 NOMINAL', 'BAT 3.92V +86mA', 'LINK OK'].forEach((l, i) => g.fillText(l, 14, 96 + i * 46));
  }],

  /* black foam board facing paper, tileable */
  foam: [512, 512, g => {
    g.fillStyle = '#202326'; g.fillRect(0, 0, 512, 512);
    const r = rng(9); for (let i = 0; i < 26000; i++) { const a = r() * 0.06; g.fillStyle = r() > 0.5 ? `rgba(255,255,255,${a})` : `rgba(0,0,0,${a * 1.5})`; g.fillRect(r() * 512, r() * 512, 1 + r() * 1.5, 1 + r() * 1.5); }
  }]
};

const key = location.hash.slice(1), spec = TEX[key];
const c = document.getElementById('c'), g = c.getContext('2d');
if (spec) {
  c.width = spec[0]; c.height = spec[1];
  Promise.all(['500 10px "IBM Plex Mono"', '600 10px "IBM Plex Mono"', '600 10px "IBM Plex Sans"', '700 10px "IBM Plex Sans"', '700 10px "IBM Plex Sans Arabic"', '700 10px "Saira Semi Condensed"', '600 10px "Saira Semi Condensed"'].map(f => document.fonts.load(f, 'Aسراب')))
    .catch(() => null).then(() => { spec[2](g); document.title = 'done'; });
}
window.TEX_SIZES = Object.fromEntries(Object.entries(TEX).map(([k, v]) => [k, [v[0], v[1]]]));
</script>
</body>
</html>
